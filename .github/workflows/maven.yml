# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.module }} (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        module: [ server, client ]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Build & test ${{ matrix.module }}
        run: ./mvnw -B -ntp verify

  dependency-graph:
    name: Submit dependency graph (${{ matrix.module }})
    # Dependabot / fork PRs only get a read-only token, so submit on push to main only
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        module: [ server, client ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
        with:
          directory: ${{ matrix.module }}
          correlator: ${{ github.job }}-${{ matrix.module }}
